
gpt-4o-mini:
    import: "./openai-chat.yaml"
    parameters:
        name: "gpt-4o-mini"
        body:
            model: "gpt-4o-mini"
            max_tokens: 512

gpt-5:
    import: "./openai-chat.yaml"
    parameters:
        name: "gpt-5"
        body:
            model: "gpt-5-2025-08-07"
            temperature: 1
            reasoning_effort: "minimal"
            max_completion_tokens: 1024
