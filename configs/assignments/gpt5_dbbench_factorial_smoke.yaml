import: definition.local.yaml

concurrency:
  task:
    dbbench-smoke-p0c0: 1
    dbbench-smoke-p0c1: 1
    dbbench-smoke-p1c0: 1
    dbbench-smoke-p1c1: 1
  agent:
    gpt-5: 1

assignments:
  - agent:
      - gpt-5
    task:
      - dbbench-smoke-p0c0
      - dbbench-smoke-p0c1
      - dbbench-smoke-p1c0
      - dbbench-smoke-p1c1

output: "outputs/gpt5_dbbench_factorial_smoke_{TIMESTAMP}"
